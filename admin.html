<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>لوحة إدارة زاد الإسلام</title>
<style>
:root{--bg:#07150f;--card:#10271d;--card2:#153426;--text:#f7fff9;--muted:#abc5b5;--gold:#dfbd72;--green:#23b66e;--red:#dc5e68;--line:rgba(255,255,255,.13)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#04100b,#0d2c20 55%,#06140e);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}.wrap{max-width:1200px;margin:auto;padding:18px}.card{background:rgba(16,39,29,.97);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}.login{max-width:470px;margin:10vh auto}.brand{display:flex;align-items:center;gap:12px}.brand i{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:#173b2b;font-style:normal;font-size:25px}.brand h1{margin:0;color:var(--gold);font-size:24px}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}label{display:block;color:var(--muted);margin:10px 0 5px}input,select,textarea{width:100%;background:#071c13;border:1px solid var(--line);color:var(--text);border-radius:13px;padding:11px;outline:0}button{border:0;border-radius:12px;padding:10px 13px;background:var(--green);color:white;font-weight:800;cursor:pointer}.secondary{background:#214636}.danger{background:var(--red)}.warn{background:#b88422}.ghost{background:transparent;border:1px solid var(--line)}.hidden{display:none!important}.status{min-height:22px;margin-top:8px;color:var(--muted);font-size:12px}.bad{color:#ff9d9d}.ok{color:#8deeb7}.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0}.tabs button{white-space:nowrap;background:#173b2b}.tabs button.active{background:var(--gold);color:#211708}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:13px;border-radius:15px;background:#0b2118;border:1px solid var(--line)}.stat b{display:block;font-size:24px;color:var(--gold)}.stat small{color:var(--muted)}.tools{display:grid;grid-template-columns:1fr 180px auto;gap:8px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.user,.video{background:#0c2118;border:1px solid var(--line);border-radius:18px;padding:14px}.userHead{display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:center}.avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#173b2b;border:1px solid var(--line);overflow:hidden;font-size:23px}.avatar img{width:100%;height:100%;object-fit:cover}.user h3,.video h3{margin:0 0 4px}.meta{color:var(--muted);font-size:11px;line-height:1.7}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:10px;border:1px solid var(--line);margin-top:5px}.badge.banned{color:#ffaaa9;border-color:rgba(255,100,100,.4)}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.actions button{font-size:11px;padding:8px 10px}.video video{width:100%;aspect-ratio:9/16;max-height:430px;object-fit:contain;background:#000;border-radius:14px;margin-bottom:9px}.empty{text-align:center;padding:32px;color:var(--muted)}.topbar{position:sticky;top:0;z-index:10;background:rgba(7,21,15,.96);border-bottom:1px solid var(--line);padding:8px 0}.topbar .wrap{padding-top:8px;padding-bottom:8px}@media(max-width:800px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.tools{grid-template-columns:1fr}.wrap{padding:12px}.topbar{position:relative}}
</style></head><body>
<section id="loginView" class="wrap"><div class="card login"><div class="brand"><i>☪</i><div><h1>دخول الإدارة</h1><p>لوحة منفصلة لإدارة زاد توك والحسابات.</p></div></div><label>اسم المستخدم</label><input id="adminUser" autocomplete="username"><label>كلمة المرور</label><input id="adminPass" type="password" autocomplete="current-password"><button id="loginBtn" style="width:100%;margin-top:12px">دخول لوحة الإدارة</button><div id="loginStatus" class="status"></div></div></section>
<section id="appView" class="hidden"><div class="topbar"><div class="wrap row between"><div class="brand"><i>☪</i><div><h1>لوحة إدارة زاد الإسلام</h1><p id="adminName"></p></div></div><button id="logoutBtn" class="ghost">تسجيل الخروج</button></div></div><main class="wrap"><div class="stats"><div class="stat"><b id="sUsers">—</b><small>الحسابات</small></div><div class="stat"><b id="sBanned">—</b><small>المحظورون</small></div><div class="stat"><b id="sVideos">—</b><small>الفيديوهات</small></div><div class="stat"><b id="sPending">—</b><small>بانتظار المراجعة</small></div></div><div class="tabs"><button data-tab="videos" class="active">🎬 الفيديوهات</button><button data-tab="users">👥 الحسابات</button></div>
<section id="videosPane"><div class="tools"><input id="videoSearch" placeholder="ابحث بعنوان الفيديو أو اسم الناشر"><select id="videoStatus"><option value="all">كل الحالات</option><option value="pending">بانتظار المراجعة</option><option value="approved">منشور</option><option value="rejected">مرفوض</option><option value="uploading">قيد الرفع</option></select><button id="refreshVideos" class="secondary">تحديث</button></div><div id="videosGrid" class="grid"></div></section>
<section id="usersPane" class="hidden"><div class="tools"><input id="userSearch" placeholder="ابحث باسم الحساب"><div></div><button id="refreshUsers" class="secondary">تحديث</button></div><div class="card"><div class="meta">Kick = تسجيل خروج من الجلسة الحالية فقط. Ban = منع الحساب من الاستخدام حتى تفك الحظر. Delete = حذف الحساب نهائيًا. حذف الفيديوهات يتم من تبويب الفيديوهات.</div></div><div id="usersGrid" class="grid"></div></section><div id="appStatus" class="status"></div></main></section>
<script>
const BASE='https://bzrhrvgddtnhctcdlgmy.supabase.co/functions/v1/';const KEY='sb_publishable_HzCPiZYRuFb3hm_duGCHVA_J020y2YL';const $=s=>document.querySelector(s);let token=localStorage.getItem('zad_admin_token')||'';let adminName=localStorage.getItem('zad_admin_name')||'';let users=[],videos=[];
async function api(fn,body){const r=await fetch(BASE+fn,{method:'POST',headers:{apikey:KEY,'content-type':'application/json'},body:JSON.stringify(body||{})});const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch(_){}if(!r.ok)throw new Error(d.message||d.error||'تعذر الاتصال بالخادم.');return d}
function esc(v){return String(v??'')}
function showApp(){if(!token){$('#loginView').classList.remove('hidden');$('#appView').classList.add('hidden');return}$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');$('#adminName').textContent=adminName||'مدير زاد الإسلام';loadAll()}
async function login(){const st=$('#loginStatus');st.textContent='جارٍ التحقق…';try{const d=await api('zad-admin-auth',{action:'login',username:$('#adminUser').value,password:$('#adminPass').value});if(!d.ok)throw new Error(d.message||'تعذر تسجيل الدخول');token=d.session_token;adminName=d.admin_display_name||$('#adminUser').value;localStorage.setItem('zad_admin_token',token);localStorage.setItem('zad_admin_name',adminName);st.textContent='';showApp()}catch(e){st.textContent=e.message;st.className='status bad'}}
async function logout(){try{await api('zad-admin-auth',{action:'logout',token})}catch(_){}token='';localStorage.removeItem('zad_admin_token');localStorage.removeItem('zad_admin_name');location.reload()}
function date(v){try{return new Intl.DateTimeFormat('ar-EG',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v))}catch(_){return ''}}
async function loadUsers(){const st=$('#appStatus');try{const d=await api('zad-admin-users',{action:'list',token,q:$('#userSearch').value});users=d.users||[];renderUsers()}catch(e){if(/unauthorized/i.test(e.message)){logout();return}st.textContent=e.message;st.className='status bad'}}
function renderUsers(){const g=$('#usersGrid');g.textContent='';if(!users.length){g.innerHTML='<div class="empty">لا توجد حسابات مطابقة.</div>';return}for(const u of users){const c=document.createElement('article');c.className='user';const name=esc(u.username||u.display_name||'مستخدم زاد الإسلام');c.innerHTML=`<div class="userHead"><div class="avatar">${u.avatar_url?`<img src="${u.avatar_url}" alt="">`:name.slice(0,1)}</div><div><h3>@${name}</h3><div class="meta">${u.video_count||0} فيديو • أنشئ ${date(u.created_at)}</div><span class="badge ${u.account_status==='banned'?'banned':''}">${u.account_status==='banned'?'محظور':'نشط'}</span>${u.ban_reason?`<div class="meta">السبب: ${esc(u.ban_reason)}</div>`:''}</div></div><div class="actions"><button class="secondary" data-act="kick">Kick / إخراج</button>${u.account_status==='banned'?'<button data-act="unban">فك الحظر</button>':'<button class="warn" data-act="ban">Ban / حظر</button>'}<button class="danger" data-act="delete">حذف الحساب</button></div>`;c.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>userAction(u,b.dataset.act));g.appendChild(c)}$('#sUsers').textContent=users.length;$('#sBanned').textContent=users.filter(x=>x.account_status==='banned').length}
async function userAction(u,action){const name=u.username||u.display_name||u.id;let reason=null;if(action==='ban'){reason=prompt('سبب حظر @'+name+' (اختياري):','')||null;if(!confirm('تأكيد حظر هذا الحساب؟'))return}if(action==='kick'&&!confirm('تسجيل خروج @'+name+' من الجلسة الحالية؟'))return;if(action==='unban'&&!confirm('فك حظر @'+name+'؟'))return;if(action==='delete'){const x=prompt('اكتب كلمة حذف لتأكيد حذف الحساب نهائيًا:');if(x!=='حذف')return}$('#appStatus').textContent='جارٍ تنفيذ العملية…';try{await api('zad-admin-users',{action,token,user_id:u.id,reason});$('#appStatus').textContent='تم التنفيذ بنجاح.';$('#appStatus').className='status ok';await loadUsers();await loadVideos()}catch(e){$('#appStatus').textContent=e.message;$('#appStatus').className='status bad'}}
async function loadVideos(){try{const d=await api('zad-talk-admin-list',{token,status:$('#videoStatus').value});videos=d.items||[];renderVideos()}catch(e){if(/unauthorized/i.test(e.message)){logout();return}$('#appStatus').textContent=e.message;$('#appStatus').className='status bad'}}
function renderVideos(){const q=$('#videoSearch').value.trim().toLowerCase();const arr=videos.filter(v=>!q||(v.title+' '+(v.submitter_name||'')).toLowerCase().includes(q));const g=$('#videosGrid');g.textContent='';if(!arr.length){g.innerHTML='<div class="empty">لا توجد فيديوهات مطابقة.</div>'}for(const v of arr){const c=document.createElement('article');c.className='video';c.innerHTML=`${v.media_url?`<video src="${v.media_url}" controls playsinline preload="metadata"></video>`:''}<h3>${esc(v.title)}</h3><div class="meta">الناشر: ${esc(v.submitter_name||'بدون حساب')} • ${esc(v.status)} • ${date(v.created_at)}</div><div class="actions">${v.status!=='approved'?'<button data-act="approve">اعتماد ونشر</button>':''}${v.status!=='rejected'?'<button class="warn" data-act="reject">رفض / إلغاء النشر</button>':''}<button class="danger" data-act="delete">حذف الفيديو</button></div>`;c.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>videoAction(v,b.dataset.act));g.appendChild(c)}$('#sVideos').textContent=videos.length;$('#sPending').textContent=videos.filter(x=>x.status==='pending').length}
async function videoAction(v,action){let reason=null;if(action==='delete'&&!confirm('حذف هذا الفيديو نهائيًا؟'))return;if(action==='reject')reason=prompt('سبب الرفض (اختياري):','')||null;if(action==='approve'&&!confirm('اعتماد ونشر هذا الفيديو؟'))return;try{await api('zad-talk-admin-review',{token,id:v.id,action,reason});$('#appStatus').textContent='تم تحديث الفيديو.';$('#appStatus').className='status ok';await loadVideos()}catch(e){$('#appStatus').textContent=e.message;$('#appStatus').className='status bad'}}
async function loadAll(){await Promise.all([loadUsers(),loadVideos()])}
$('#loginBtn').onclick=login;$('#adminPass').onkeydown=e=>{if(e.key==='Enter')login()};$('#logoutBtn').onclick=logout;$('#refreshUsers').onclick=loadUsers;$('#refreshVideos').onclick=loadVideos;$('#videoStatus').onchange=loadVideos;$('#videoSearch').oninput=renderVideos;let ut;$('#userSearch').oninput=()=>{clearTimeout(ut);ut=setTimeout(loadUsers,250)};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));$('#videosPane').classList.toggle('hidden',b.dataset.tab!=='videos');$('#usersPane').classList.toggle('hidden',b.dataset.tab!=='users')});showApp();
</script></body></html>
